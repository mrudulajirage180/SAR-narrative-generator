<!DOCTYPE html>
<html>
<head>
    <title>FinGuard AI - SAR Compliance System</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #333;
        }

        header {
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            width: 50%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            color: white;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        textarea {
            height: 130px;
        }

        button {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .generate-btn {
            background: #00f5a0;
            color: black;
        }

        .generate-btn:hover {
            background: #00c97d;
        }

        .approve-btn {
            background: #ff512f;
            color: white;
        }

        .approve-btn:hover {
            background: #dd3e1f;
        }

        .risk-meter {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            text-align: center;
        }

        .low { background: #2ecc71; }
        .medium { background: #f39c12; }
        .high { background: #e74c3c; }

        .audit-section {
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: #667eea;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }
    </style>
</head>

<body>

<header>
    FinGuard AI – Smart SAR Narrative Generator
</header>

<div class="container">

    <div class="card">
        <h2>Transaction Input</h2>

        <input type="text" id="officer" placeholder="Officer Name">
        <input type="text" id="account" placeholder="Account Number">
        <input type="number" id="amount" placeholder="Transaction Amount">
        <input type="date" id="date">
        <textarea id="reason" placeholder="Why is this suspicious?"></textarea>

        <button class="generate-btn" onclick="generateSAR()">Generate SAR</button>

        <div id="riskDisplay"></div>
    </div>

    <div class="card">
        <h2>Generated SAR Narrative</h2>
        <textarea id="sarOutput" placeholder="AI-generated SAR appears here..."></textarea>
        <button class="approve-btn" onclick="approveSAR()">Approve SAR</button>
    </div>

</div>

<div class="audit-section">
    <h2 style="color:white;">Audit Trail</h2>

    <table id="auditTable">
        <tr>
            <th>Timestamp</th>
            <th>User</th>
            <th>Action</th>
        </tr>
    </table>
</div>

<script>

function generateSAR() {

    let officer = document.getElementById("officer").value;
    let account = document.getElementById("account").value;
    let amount = document.getElementById("amount").value;
    let date = document.getElementById("date").value;
    let reason = document.getElementById("reason").value;

    if(account === "" || amount === "" || date === "" || officer === "") {
        alert("Please fill all fields!");
        return;
    }

    let riskScore = Math.floor(Math.random() * 100) + 1;
    let riskLevel = "";
    let riskClass = "";

    if(riskScore < 40) {
        riskLevel = "Low Risk";
        riskClass = "low";
    } else if(riskScore < 70) {
        riskLevel = "Medium Risk";
        riskClass = "medium";
    } else {
        riskLevel = "High Risk";
        riskClass = "high";
    }

    document.getElementById("riskDisplay").innerHTML =
        `<div class="risk-meter ${riskClass}">
            Risk Score: ${riskScore}% - ${riskLevel}
        </div>`;

    let sarText = `
On ${date}, Account ${account} executed a transaction of ₹${amount}.
The transaction was flagged because ${reason}.
The calculated risk score is ${riskScore}% (${riskLevel}).
The activity deviates from normal behavior and requires regulatory investigation.
    `;

    document.getElementById("sarOutput").value = sarText;

    addAuditLog(officer, "SAR Generated");
}

function approveSAR() {

    let officer = document.getElementById("officer").value;

    if(document.getElementById("sarOutput").value === "") {
        alert("Generate SAR first!");
        return;
    }

    addAuditLog(officer, "SAR Approved");
    alert("SAR Approved Successfully!");
}

function addAuditLog(user, action) {

    let table = document.getElementById("auditTable");
    let row = table.insertRow(-1);

    let timeCell = row.insertCell(0);
    let userCell = row.insertCell(1);
    let actionCell = row.insertCell(2);

    let now = new Date().toLocaleString();

    timeCell.innerHTML = now;
    userCell.innerHTML = user;
    actionCell.innerHTML = action;
}

</script>

</body>
</html>
